  /* Gala theme: midnight violet, gold, magenta and orange ribbons */
  --bg:#160e33; --bg-glow:#3b1a6e; --surface:rgba(34,20,78,.86); --surface-2:rgba(255,255,255,.06); --ink:#FBF3DC; --muted:#C8BDE6; --line:rgba(242,207,115,.28);
  --gold:#F2CF73; --gold-2:#C9962E; --on-gold:#1d1140; --ok:#7EE0B8; --warn:#FFA48C;
  --jade:#8B3FC1; --saffron:#F59E2B; --rose:#E0228A; --lapis:#4A63E0;
  --display:"Montserrat","Segoe UI",system-ui,Arial,sans-serif;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Montserrat","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1rem calc(3rem + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.bgart{position:fixed;inset:0;z-index:-1;background-color:#1b1040;
  background-image:linear-gradient(180deg,rgba(18,10,42,.55) 0%,rgba(18,10,42,.25) 45%,rgba(18,10,42,.35) 100%),var(--art);
  background-size:cover,cover;background-position:center,center bottom;background-repeat:no-repeat}
@media (orientation:portrait){ .bgart{background-size:cover,auto 100%} }
.shell{max-width:1240px;margin:0 auto}
.brand{text-align:center;margin:.5rem auto 1.6rem;max-width:46rem}
.brand .logos{display:block;width:min(94%,660px);height:auto;margin:0 auto clamp(1rem,3vh,2rem)}
.brand .kick{margin:0;font-weight:600;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);font-size:clamp(.85rem,2.4vw,1.6rem);padding-left:.38em}
.brand .ttl{margin:.15em 0 .1em;font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:.015em;text-transform:uppercase;font-size:clamp(2.1rem,7.2vw,4.8rem);
  background:linear-gradient(180deg,#FFF0B8 0%,#F2CF73 50%,#D5A443 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45))}

/* bigger, wider lucky number; no "numbers left" line on screen */

.ld-panel{padding:.6vh 1.5vw}
.ld-line{font-size:clamp(1rem,1.9vw,2rem)}
/* compact registration form */
body:not(.drawmode):not(.wide):not(.postermode) .card{padding:1.1rem 1.1rem 1.2rem;border-radius:16px}

.btn.big{padding:.8rem;font-size:1rem;margin-top:1rem}
.msg{margin:.4rem 0 0;font-size:.9rem}
.steps{margin:0 0 .8rem;font-size:.8rem}
.steps li b{width:1.3rem;height:1.3rem;font-size:.72rem}

.lucky{font-size:clamp(4rem,20vw,6.5rem)}
@media (min-width:900px) and (orientation:landscape){

}
/* extra-compact registration form */
body:not(.drawmode):not(.wide):not(.postermode) main{max-width:25rem}
body:not(.drawmode):not(.wide):not(.postermode) .card{padding:.9rem .95rem 1rem;border-radius:14px}
body:not(.drawmode):not(.wide):not(.postermode) .card h2{font-size:.9rem;letter-spacing:.14em;margin:0}
label.f{font-size:.76rem;margin-top:.55rem;letter-spacing:.01em}
input[type=text],input[type=tel],input[type=email],input[type=password],select{font-size:.9rem;padding:.48rem .75rem;border-radius:9px;margin-top:.2rem}
.btn.big{padding:.68rem;font-size:.92rem;margin-top:.85rem}
.msg{font-size:.82rem;min-height:0}
.steps{font-size:.74rem;margin:0 0 .6rem;gap:.3rem}
.steps li b{width:1.15rem;height:1.15rem;font-size:.66rem}
@media (min-width:900px) and (orientation:landscape){
  body:not(.wide):not(.drawmode):not(.postermode) main{max-width:24rem}
}
/* phone view (what staff see after scanning) */
@media (max-width:600px){
  body{padding:calc(.9rem + env(safe-area-inset-top,0px)) .8rem calc(2rem + env(safe-area-inset-bottom,0px))}
  .brand{margin:.1rem auto .9rem}
  .brand .logos{width:min(100%,320px);margin-bottom:.7rem}
  .brand .kick{font-size:.7rem;letter-spacing:.3em}
  .brand .ttl{font-size:1.7rem;margin:.1em 0}
  .brand .motto{font-size:.92rem;gap:.5rem}
  .brand .motto::before,.brand .motto::after{flex-basis:1.4rem}
  .brand .when{font-size:.74rem;margin-top:.5rem;gap:.1rem}
  body:not(.drawmode):not(.wide):not(.postermode) main{max-width:100%}
  body:not(.drawmode):not(.wide):not(.postermode) .card{padding:1rem .95rem 1.1rem}
  body:not(.drawmode):not(.wide):not(.postermode) .card h2{font-size:.88rem}
  .steps{font-size:.7rem;margin-bottom:.55rem}
  label.f{font-size:.8rem;margin-top:.65rem}
  /* 16px stops iPhones zooming in when a field is tapped; 44px is a comfortable touch target */
  input[type=text],input[type=tel],input[type=email],input[type=password],select{font-size:16px;min-height:44px;padding:.55rem .8rem}
  .btn.big{min-height:48px;font-size:1rem;margin-top:.95rem}
  .who{font-size:1.5rem}
  .lucky{font-size:clamp(4.2rem,24vw,6rem)}
}
/* dashboard: compact header, totals, live */
body.dashmode .brand{margin:0 auto 1rem}
body.dashmode .brand .logos{width:min(70%,420px);margin-bottom:.6rem}
body.dashmode .brand .kick{font-size:clamp(.7rem,1vw,.95rem)}
body.dashmode .brand .ttl{font-size:clamp(1.5rem,2.8vw,2.6rem)}
body.dashmode .brand .motto{font-size:clamp(.9rem,1.2vw,1.15rem)}
body.dashmode .brand .when{font-size:clamp(.72rem,.95vw,.9rem);margin-top:.5rem}
.db-top{display:grid;grid-template-columns:minmax(14rem,.8fr) 2.2fr;gap:1rem;align-items:stretch}
.db-total{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1rem 1.2rem;display:flex;flex-direction:column;justify-content:center}
.db-label{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.db-total-num{font-family:var(--display);font-weight:800;font-size:clamp(3rem,6vw,5rem);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.db-bump{animation:dbbump .9s ease}
@keyframes dbbump{0%{transform:scale(1)}30%{transform:scale(1.18);color:#fff}100%{transform:scale(1)}}
.db-live{display:flex;align-items:center;gap:.45rem;margin:.4rem 0 0;font-size:.8rem;font-weight:700;color:var(--ok)}
.db-live.off{color:var(--warn)}
.db-dot{width:.6rem;height:.6rem;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:dbpulse 1.8s infinite}
@keyframes dbpulse{0%{box-shadow:0 0 0 0 rgba(126,224,184,.6)}70%{box-shadow:0 0 0 .55rem rgba(126,224,184,0)}100%{box-shadow:0 0 0 0 rgba(126,224,184,0)}}
.db-sub{margin:.2rem 0 0;font-size:.74rem;color:var(--muted)}
.db-orgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.7rem}
.db-org{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.7rem;align-items:center}
.db-org-n{grid-row:1/3;font-family:var(--display);font-weight:800;font-size:2rem;color:var(--ink);font-variant-numeric:tabular-nums}
.db-org-name{font-size:.82rem;font-weight:600;color:var(--muted);line-height:1.2}
.db-org-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.35rem}
.db-org-bar i{display:block;height:100%;border-radius:999px;transition:width .6s}
.db-actions{margin:.9rem 0 0}
.db-grid{margin-top:1rem}
.db-grid .card{padding:1rem 1.1rem}
.db-grid h2{font-size:1rem;margin:0 0 .6rem}
.db-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.db-pill{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem}
.db-depts{max-height:56vh;overflow:auto;padding-right:.3rem}
body.dashmode .dept{grid-template-columns:minmax(0,1.6fr) 1.4fr 2.2rem;gap:.6rem;margin:.35rem 0;font-size:.88rem}
body.dashmode .dept .dname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dashmode .dept .dnum{font-weight:800;color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
body.dashmode .dept .fill{transition:width .6s}
body.dashmode .feed{max-height:56vh;overflow:auto}
body.dashmode .feed li{padding:.45rem 0;font-size:.9rem}
@media (max-width:820px){ .db-top{grid-template-columns:1fr} }
/* opening screen */
.ld-start{position:fixed;inset:0;z-index:91;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 50% 55%,#3b1a6e 0%,#160e33 60%,#07040f 100%);animation:introIn .4s ease both}
.ld-start.out{animation:introOut .6s ease both}
.ld-start-stage{position:relative;z-index:1;text-align:center;padding:0 5vw}
.ld-start-title{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;line-height:1;font-size:clamp(3rem,10vw,9rem);white-space:nowrap;
  background:linear-gradient(180deg,#FFF3C4,#F2CF73 45%,#C9962E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 40px rgba(242,207,115,.45));animation:fadeUp .9s .7s ease both}
.ld-start-when{margin:1.6vh 0 4vh;color:var(--ink);font-weight:600;letter-spacing:.06em;font-size:clamp(.85rem,1.5vw,1.3rem);animation:fadeUp .9s .9s ease both}
.ld-start-when .sep{color:var(--rose);margin:0 .7em}
.ld-start-btns{display:flex;justify-content:center;align-items:center;width:100%;animation:fadeUp .9s 1.1s ease both}
.ld-start-btns .ld-btn{min-width:min(26rem,80vw);padding:clamp(.9rem,2.2vh,1.4rem) 2rem;font-size:clamp(1rem,1.5vw,1.4rem)}
.ld-start-go{animation:goPulse 1.6s 2s ease-in-out infinite}
@keyframes goPulse{0%,100%{box-shadow:0 12px 34px -14px rgba(242,207,115,.8)}50%{box-shadow:0 0 0 10px rgba(242,207,115,.15),0 12px 50px -8px rgba(242,207,115,1)}}
.ld-start .linkbtn{display:block;margin:1.6vh auto 0;color:var(--muted)}
.ld-start-keys{margin:1vh 0 0;color:var(--muted);font-size:.8rem;opacity:.7}
@media (prefers-reduced-motion:reduce){ .ld-start-go,.ld-start-title,.ld-start-when,.ld-start-btns{animation:none} }
/* voting page */
.vote-card{position:relative}
.vote-crown{font-size:2.4rem;line-height:1;text-align:center;margin:0 0 .3rem;filter:drop-shadow(0 0 18px rgba(242,207,115,.6))}
.vote-crown.big{font-size:4rem;animation:float 2.4s ease-in-out infinite alternate}
.vote-sec{margin-top:1rem}
.vote-cat{margin:0 0 .5rem;font-size:1rem;color:var(--gold);font-family:var(--display);font-weight:800;letter-spacing:.02em}
.vote-done{margin:0;padding:.6rem .8rem;border-radius:10px;background:rgba(126,224,184,.1);color:var(--ok);font-weight:700;font-size:.9rem}
.nom-grid{display:grid;gap:.5rem}
.nom{display:flex;align-items:center;gap:.75rem;width:100%;text-align:left;padding:.6rem .75rem;border:1.5px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;min-height:56px}
.nom[aria-checked="true"]{border-color:var(--gold);background:rgba(242,207,115,.12);box-shadow:0 0 0 3px rgba(242,207,115,.15)}
.av{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:.95rem}
.av.queen{background:linear-gradient(135deg,#E0228A,#8B3FC1)}
.av.king{background:linear-gradient(135deg,#4A63E0,#8B3FC1)}
.nom-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.nom-txt b{font-size:.98rem}
.nom-txt small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nom-tick{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;color:transparent}
.nom[aria-checked="true"] .nom-tick{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
/* table number on the registration result */
.tablebox{margin:.7rem auto .2rem;display:inline-flex;flex-direction:column;align-items:center;padding:.45rem 1.3rem .55rem;border:1.5px solid var(--gold);border-radius:14px;background:rgba(242,207,115,.08)}
.tablebox .numlabel{margin:0}
.tableno{margin:0;font-size:2.1rem;font-weight:800;color:var(--gold);line-height:1.1;letter-spacing:.02em}
/* King & Queen voting from the list of registered staff */
.vt-tabs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.2rem 0 .7rem}
.vt-tab{display:flex;align-items:center;gap:.5rem;padding:.55rem .6rem;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);text-align:left;cursor:pointer;min-width:0;font:inherit}
.vt-tab[aria-selected="true"].king{border-color:#7FB2FF;background:rgba(74,99,224,.18)}
.vt-tab[aria-selected="true"].queen{border-color:#FF7AC6;background:rgba(224,34,138,.16)}
.vt-tab:disabled{opacity:.55;cursor:default}
.vt-tab-t{display:flex;flex-direction:column;min-width:0}
.vt-tab-t b{font-size:.82rem;line-height:1.2}
.vt-tab-t small{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt-tab.picked .vt-tab-t small{color:var(--gold);font-weight:700}
.vt-search{width:100%;margin:0 0 .6rem}
.vt-list{display:flex;flex-direction:column;gap:.45rem;max-height:52vh;overflow-y:auto;padding-right:.15rem;margin-bottom:.4rem}
.vt-dept{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.vt-dept>summary{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.6rem .75rem;cursor:pointer;font-weight:700;font-size:.9rem;list-style:none}
.vt-dept>summary::-webkit-details-marker{display:none}
.vt-dept>summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.vt-dept[open]>summary::after{transform:rotate(180deg)}
.vt-dept>summary small{margin-left:auto;color:var(--muted);font-weight:600}
.vt-row{display:flex;align-items:center;gap:.6rem;width:100%;padding:.5rem .75rem;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.vt-row .av{width:2.1rem;height:2.1rem;font-size:.8rem}
.vt-name{flex:1;min-width:0;font-weight:600;display:flex;flex-direction:column;line-height:1.25}
.vt-sid{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
.vt-also{font-size:.7rem;color:var(--muted)}
.vt-row[aria-checked="true"]{background:rgba(242,207,115,.12)}
.vt-row[aria-checked="true"] .nom-tick{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.vt-bar{position:sticky;bottom:0;margin:0 -.2rem;padding:.6rem .2rem .2rem;background:linear-gradient(180deg,transparent,var(--card-bg,#1a0f33) 25%)}
.vt-sum{display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem .9rem;font-size:.82rem;margin:0 0 .45rem;color:var(--muted)}
.vt-sum b{color:var(--ink)}
/* royal icons and tagline */
.royal{display:inline-block;line-height:0;filter:drop-shadow(0 4px 14px rgba(242,207,115,.45))}
.royal svg{width:100%;height:auto;display:block}
.royal.sm{width:1.7rem;vertical-align:middle;filter:drop-shadow(0 2px 6px rgba(242,207,115,.4))}
.royal-pair{display:flex;justify-content:center;align-items:flex-end;gap:.8rem}
.royal-pair .royal{width:3.4rem}
.royal-pair.sm{display:inline-flex;gap:.3rem;vertical-align:middle}
.royal-pair.sm .royal{width:1.5rem}
.vote-crowns{margin:0 0 .4rem}
.vote-crowns.big .royal{width:4.6rem;animation:float 2.4s ease-in-out infinite alternate}

.poster-crowns{margin:.8rem 0 .3rem}
.poster-crowns .royal{width:4rem}
.vote-cat{display:flex;align-items:center;gap:.5rem}
.bd-tag{display:flex;align-items:center;justify-content:center;gap:.7rem;margin:.35rem 0 .6rem}
.bd-text{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(1.1rem,3.5vw,1.6rem);letter-spacing:.02em;white-space:nowrap;
  background:linear-gradient(90deg,#F2CF73,#FFF3C4 45%,#E0228A 75%,#F2CF73);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 5s linear infinite}
.bd-line{flex:0 1 3.5rem;height:1px;position:relative;background:linear-gradient(90deg,transparent,var(--gold))}

.bd-line::after{content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.bd-line.r::after{right:auto;left:-3px}
.ld-head .bd-tag{margin:.4vh 0 0}
.ld-head .bd-text{font-size:clamp(1rem,1.8vw,1.8rem)}
.aw-card .royal.aw-crown{width:clamp(4rem,10vh,7rem);font-size:0}
.royal.aw-crown.big{width:clamp(6rem,16vh,11rem);margin:0 auto 2vh;display:block}
.royal.cele-crown{width:clamp(6rem,16vh,11rem);font-size:0;display:block;margin:0 auto}
/* awards winner celebration */
.awc{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;animation:introIn .4s ease both}
.awc.out{animation:celeOut .7s ease both}
.awc.queen{background:radial-gradient(ellipse 65% 60% at 50% 45%,#6d1f6e 0%,#2c0d45 55%,#0a0418 100%)}
.awc.king{background:radial-gradient(ellipse 65% 60% at 50% 45%,#23307e 0%,#170d47 55%,#05041a 100%)}
.awc-spot{position:absolute;top:-12vh;width:34vw;height:135vh;pointer-events:none;mix-blend-mode:screen;filter:blur(10px);transform-origin:50% 0;
  background:linear-gradient(180deg,rgba(255,250,230,.45),rgba(255,250,230,.08) 60%,transparent 85%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}
.awc-spot.l{left:2vw;animation:sweepL 5s ease-in-out infinite alternate}
.awc-spot.r{right:2vw;animation:sweepR 5s ease-in-out infinite alternate}
@keyframes sweepL{from{transform:rotate(-28deg)}to{transform:rotate(14deg)}}
@keyframes sweepR{from{transform:rotate(28deg)}to{transform:rotate(-14deg)}}
.awc-stage{position:relative;z-index:2;text-align:center;padding:0 4vw;max-width:96vw}
.awc-crownwrap{position:relative;display:inline-block;margin-bottom:1vh}
.awc-burst{position:absolute;left:50%;top:55%;width:42vmin;height:42vmin;transform:translate(-50%,-50%);border-radius:50%;animation:burstPulse 1.8s ease-in-out infinite alternate}
.awc.queen .awc-burst{background:radial-gradient(circle,rgba(255,120,200,.75),rgba(255,61,154,.25) 40%,transparent 70%)}
.awc.king .awc-burst{background:radial-gradient(circle,rgba(127,178,255,.75),rgba(74,99,224,.25) 40%,transparent 70%)}
@keyframes burstPulse{from{transform:translate(-50%,-50%) scale(.85);opacity:.7}to{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
.royal.awc-crown{position:relative;width:clamp(7rem,19vh,13rem);filter:drop-shadow(0 10px 30px rgba(0,0,0,.5)) drop-shadow(0 0 30px rgba(255,230,160,.6));animation:crownDrop 1s cubic-bezier(.2,1.5,.4,1) both,float 2.6s 1.1s ease-in-out infinite alternate}
@keyframes crownDrop{from{transform:translateY(-70vh) rotate(-25deg) scale(.6)}to{transform:none}}
.awc-title{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.16em;font-size:clamp(1.7rem,5vw,4.4rem);line-height:1.1}
.awc-title span{display:inline-block;opacity:0;animation:letter .6s cubic-bezier(.2,1.6,.4,1) forwards,shimmer 4s 1.5s linear infinite;background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.awc.queen .awc-title span{background-image:linear-gradient(90deg,#FF7AC6,#FFE08A,#C38BFF,#FF7AC6);filter:drop-shadow(0 0 18px rgba(255,61,154,.55))}
.awc.king .awc-title span{background-image:linear-gradient(90deg,#7FB2FF,#FFE08A,#9F7BFF,#7FB2FF);filter:drop-shadow(0 0 18px rgba(74,99,224,.6))}
.awc-tie{margin:.8vh 0 0;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#FFE08A;font-size:clamp(1rem,2.4vh,1.6rem)}
.awc-people{display:flex;justify-content:center;gap:4vw;flex-wrap:wrap;margin-top:1.6vh}
.awc-person{opacity:0;animation:nameIn 1s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes nameIn{from{opacity:0;transform:scale(1.8);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.awc-name{margin:0;font-family:var(--display);font-weight:800;line-height:1.05;font-size:clamp(3rem,10.5vh,8.5rem)}
.awc-people.tie .awc-name{font-size:clamp(2.2rem,7vh,5.5rem)}
.awc-name span{background:linear-gradient(110deg,#FFF3C4 0%,#ffffff 30%,#F2CF73 55%,#FFF3C4 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s 1.8s linear infinite}
.awc.queen .awc-name span{filter:drop-shadow(0 0 26px rgba(255,61,154,.7)) drop-shadow(0 4px 0 rgba(90,0,50,.35))}
.awc.king .awc-name span{filter:drop-shadow(0 0 26px rgba(74,130,255,.75)) drop-shadow(0 4px 0 rgba(10,20,80,.35))}
.awc-chips{display:flex;justify-content:center;flex-wrap:wrap;gap:.7rem;margin-top:1.4vh}
.awc-chips.votes{opacity:0;animation:fadeUp .7s 1.8s ease forwards}
.awc-chip{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem 1.1rem;border-radius:999px;font-weight:700;font-size:clamp(1rem,2.4vh,1.6rem);backdrop-filter:blur(4px)}
.awc-chip i{font-style:normal}
.awc-chip.id{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.55);color:#fff}
.awc.queen .awc-chip.dept{background:rgba(255,61,154,.2);border:1.5px solid #FF7AC6;color:#FFD6EC}
.awc.king .awc-chip.dept{background:rgba(74,99,224,.25);border:1.5px solid #7FB2FF;color:#DCE7FF}
.awc-chip.votes{background:rgba(242,207,115,.16);border:1.5px solid var(--gold);color:#FFE7A6}
.awc-cta{display:inline-block;margin:2.2vh 0 0;padding:.6rem 1.6rem;border-radius:999px;font-weight:800;letter-spacing:.06em;font-size:clamp(1rem,2.4vh,1.5rem);color:#2b1250;
  background:linear-gradient(180deg,#FFF3C4,#F2CF73 55%,#D9A441);box-shadow:0 10px 30px -10px rgba(242,207,115,.9);opacity:0;animation:fadeUp .7s 2s ease forwards}
@media (prefers-reduced-motion:reduce){ .awc-spot,.awc-burst,.royal.awc-crown,.awc-name span{animation:none} .awc-title span,.awc-person,.awc-chips.votes,.awc-cta{animation:fadeUp .3s ease forwards} }
/* blinking sparkles */
.tw-layer{position:absolute;inset:0;pointer-events:none;z-index:1}
.tw{position:absolute;transform:translate(-50%,-50%) scale(0);background:currentColor;opacity:0;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 6px currentColor);animation:twinkle 1.6s ease-in-out infinite}
.tw.big{filter:drop-shadow(0 0 12px currentColor)}
@keyframes twinkle{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}45%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(45deg)}60%{opacity:.9;transform:translate(-50%,-50%) scale(.85) rotate(60deg)}}
/* reveal: "The King of the Night is…" */
.awr-title{margin:1.2vh 0 0;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;line-height:1.15;font-size:clamp(1.6rem,4.4vw,4rem)}
.awr-w{display:inline-block;margin:0 .22em;opacity:0;animation:wordUp .7s cubic-bezier(.2,1.4,.4,1) forwards,shimmer 4s 1.2s linear infinite;background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.awr.queen .awr-w{background-image:linear-gradient(90deg,#FF7AC6,#FFE08A,#C38BFF,#FF7AC6);filter:drop-shadow(0 0 16px rgba(255,61,154,.5))}
.awr.king .awr-w{background-image:linear-gradient(90deg,#7FB2FF,#FFE08A,#9F7BFF,#7FB2FF);filter:drop-shadow(0 0 16px rgba(74,130,255,.55))}
@keyframes wordUp{from{opacity:0;transform:translateY(30px) scale(.8);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.royal.awr-crown{position:relative;width:clamp(5.5rem,14vh,10rem);filter:drop-shadow(0 0 30px rgba(255,230,160,.7));animation:crownDrop .9s cubic-bezier(.2,1.5,.4,1) both,float 2.2s 1s ease-in-out infinite alternate}
.awr-rollwrap{margin-top:3vh;min-height:1.2em;font-size:clamp(2.6rem,9vw,8rem)}
.awr .aw-roll{margin:0;font-size:inherit;background:linear-gradient(180deg,#ffffff,#FFF3C4 40%,#F2CF73);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.awr.queen .aw-roll{filter:drop-shadow(0 0 24px rgba(255,61,154,.75))}
.awr.king .aw-roll{filter:drop-shadow(0 0 24px rgba(74,130,255,.8))}
.aw-roll.tick{animation:rollBlink .18s ease-out}
@keyframes rollBlink{0%{opacity:.35;transform:scale(1.08)}100%{opacity:1;transform:none}}
/* winner: light flash + spinning halo behind the crown */
.awc-flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 40%,#fff 0%,rgba(255,243,196,.8) 25%,transparent 65%);animation:flash 1.2s ease-out forwards}
.awc-halo{position:absolute;left:50%;top:55%;width:34vmin;height:34vmin;transform:translate(-50%,-50%);border-radius:50%;
  background:conic-gradient(from 0deg,transparent,rgba(255,243,196,.85),transparent 25%,rgba(255,255,255,.7),transparent 50%,rgba(255,243,196,.85),transparent 75%,rgba(255,255,255,.7),transparent);
  -webkit-mask:radial-gradient(circle,transparent 52%,#000 54%,#000 58%,transparent 60%);mask:radial-gradient(circle,transparent 52%,#000 54%,#000 58%,transparent 60%);animation:haloSpin 3s linear infinite}
@keyframes haloSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.awc .awc-name span{animation:shimmer 3s 1.8s linear infinite,nameBlink 2.4s 2s ease-in-out infinite}
@keyframes nameBlink{0%,100%{opacity:1}50%{opacity:.82}}
@media (prefers-reduced-motion:reduce){ .tw,.awc-halo,.awr-w,.awc .awc-name span{animation:none!important;opacity:1} }
/* stage music controls */
.mc{position:absolute;left:1.5vw;bottom:2vh;z-index:3;display:flex;gap:.5rem;opacity:.55;transition:opacity .2s}
.mc:hover,.mc:focus-within{opacity:1}
.mc.fixed{position:fixed;z-index:44;left:1.2vw;bottom:1.6vh}
body:not(.drawmode) .mc.fixed{display:none}
.mc-btn{background:rgba(14,8,34,.65);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.45rem .9rem;font-weight:600;font-size:.85rem;cursor:pointer}
.mc-btn:disabled{opacity:.4;cursor:default}
/* nominee showcase */
.awn-kick{margin:.6vh 0 0;color:var(--muted);font-weight:700;letter-spacing:.3em;text-transform:uppercase;font-size:clamp(.85rem,1.8vh,1.2rem)}
.royal.awn-crown{width:clamp(4.5rem,11vh,8rem);animation:crownDrop .9s cubic-bezier(.2,1.5,.4,1) both,float 2.6s 1s ease-in-out infinite alternate}
.awn-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:1.6vw;margin:3vh auto 0;max-width:90vw}
.awn-card{width:clamp(11rem,17vw,18rem);padding:2.2vh 1vw;border-radius:22px;text-align:center;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.7);animation:cardIn .8s cubic-bezier(.2,1.4,.4,1) both}
.awn.queen .awn-card{border-color:rgba(255,122,198,.55)}
.awn.king .awn-card{border-color:rgba(127,178,255,.55)}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.7);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.awn-av{display:grid;place-items:center;margin:0 auto 1.2vh;width:clamp(4.5rem,11vh,7.5rem);aspect-ratio:1;border-radius:50%;font-family:var(--display);font-weight:800;color:#fff;font-size:clamp(1.6rem,4vh,2.8rem);box-shadow:0 0 0 3px rgba(242,207,115,.7),0 0 40px rgba(242,207,115,.35)}
.awn-av.queen{background:radial-gradient(circle at 35% 30%,#ff6fb5,#8B3FC1 70%)}
.awn-av.king{background:radial-gradient(circle at 35% 30%,#8fa6ff,#3a2a9a 70%)}
.awn-av.photo,.aw-orb.photo{background:#140a2c;overflow:hidden;padding:0}
.awn-av.photo img,.aw-orb.photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.awn-grid.pics .awn-av{width:clamp(6.5rem,17vh,10.5rem)}
.aw-orb{flex:none}
.awc-photo{width:clamp(10rem,30vh,19rem);aspect-ratio:1;margin:0 auto 1.4vh;border-radius:50%;overflow:hidden;border:5px solid #F2CF73;box-shadow:0 0 0 6px rgba(255,243,196,.25),0 0 70px rgba(242,207,115,.65);opacity:0;animation:photoIn 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
.awc-photo img{width:100%;height:100%;object-fit:cover;display:block}
.awc-people.tie .awc-photo{width:clamp(7rem,20vh,12rem)}
@keyframes photoIn{0%{opacity:0;transform:scale(.3) rotate(-12deg)}100%{opacity:1;transform:none}}
/* one award at a time: King page, then Queen page */
.aw-body.single{grid-template-columns:minmax(0,62rem);justify-content:center}
.aw-body.single .aw-card:not(.on){display:none}
.aw-body.single .aw-card .royal.aw-crown{width:clamp(5rem,13vh,9rem)}
.aw-body.single .aw-orb{width:clamp(7rem,21vh,13rem)}
.aw-body.single .aw-label{font-size:clamp(2.2rem,6vh,4.4rem)}
.aw-next{position:fixed;right:5.2rem;bottom:1.2rem;z-index:30;opacity:.85}
.aw-next:hover{opacity:1}
.ph-row{display:flex;align-items:center;gap:.8rem;padding:.55rem 0;border-top:1px solid var(--line)}
.ph-av{flex:none;width:3.6rem;height:3.6rem;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:800;color:#fff;background:#3a2a9a}
.ph-av img{width:100%;height:100%;object-fit:cover}
.ph-row .ph-t{flex:1;min-width:0}
.ph-row .ph-t small{display:block;color:var(--muted)}
/* ===== dashboard: event-themed hero, quick settings, livelier cards ===== */
body.dashmode .brand{max-width:1100px;padding:3.2vh 2vw 2.6vh;border-radius:26px;border:1px solid rgba(242,207,115,.45);
  background:linear-gradient(180deg,rgba(18,10,42,.35),rgba(18,10,42,.55)),var(--art) center 38%/cover no-repeat;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 60px rgba(242,207,115,.12)}
body.dashmode .brand .ttl{font-size:clamp(2rem,4vw,3.6rem)!important;background:linear-gradient(90deg,#FFF3C4,#F2CF73 25%,#FFE08A 45%,#FF9AD0 60%,#F2CF73 80%,#FFF3C4);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(242,207,115,.45));animation:shimmer 7s linear infinite}
body.dashmode .brand .kick{color:#FFE08A;text-shadow:0 2px 0 #000}
body.dashmode .brand .motto,body.dashmode .brand .when{text-shadow:0 2px 6px rgba(0,0,0,.8)}
.db-quick{position:sticky;top:.4rem;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;max-width:1100px;margin:0 auto 1rem;padding:.55rem .7rem;border-radius:18px;
  background:rgba(22,12,52,.88);border:1px solid rgba(242,207,115,.4);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.db-quick-h{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem;color:#FFE08A;margin-right:.3rem}
.db-q{display:inline-flex;align-items:center;gap:.4rem;font:inherit;font-size:.86rem;font-weight:700;padding:.42rem .8rem;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.db-q:hover{transform:translateY(-2px);border-color:#F2CF73;background:rgba(242,207,115,.14)}
.db-q.t-teal .db-q-i{color:#5EF0D8}.db-q.t-gold .db-q-i{color:#FFE08A}.db-q.t-magenta .db-q-i{color:#FF7AC6}
body.dashmode .card,body.dashmode .db-total,body.dashmode .db-group{transition:transform .2s,box-shadow .2s}
body.dashmode .db-group{border-top:3px solid transparent;background:linear-gradient(rgba(26,14,58,.82),rgba(26,14,58,.82)) padding-box,linear-gradient(90deg,#3FE3CF,#F2CF73,#FF7AC6) border-box}
body.dashmode .db-link:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.35),0 0 20px rgba(242,207,115,.25)}
body.dashmode .db-total-num{background:linear-gradient(180deg,#ffffff,#FFE08A 55%,#F2A93B);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(242,207,115,.45))}
body.dashmode .card h2,body.dashmode .db-settings summary span:first-child{color:#FFE08A}
.mv-box{margin:.8rem 0;border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem}
.mv-box summary{cursor:pointer;font-weight:700;color:#FFE08A}
.mv-list{display:grid;gap:.25rem;margin:.5rem 0;max-height:30vh;overflow:auto}
.mv-row{display:flex;align-items:center;gap:.5rem;font-size:.9rem}
.mv-row small{color:var(--muted)}
/* ===== Long Service Award ===== */
.lsa-ed .row span{min-width:4rem}
.lsa-hits{display:grid;gap:.3rem;margin:.3rem 0 .8rem;max-width:40rem}
.lsa-hit{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n a" "s a";text-align:left;gap:0 .8rem;padding:.45rem .7rem;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;cursor:pointer}
.lsa-hit b{grid-area:n}.lsa-hit small{grid-area:s;color:var(--muted)}.lsa-hit span{grid-area:a;align-self:center;color:#FFE08A;font-weight:800}
.lsa-hit:disabled{opacity:.5;cursor:default}
.lsa-thumb{width:3rem;height:3rem;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer;padding:0;font-size:1.2rem}
.lsa-thumb img{width:100%;height:100%;object-fit:cover}
.lsa-tbl td{vertical-align:middle}
.lsa-dlg{width:min(70rem,96vw)}
.lsa .lsa-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.2vh;position:relative;z-index:1}
.lsa-medal{font-size:clamp(4rem,14vh,9rem);line-height:1;filter:drop-shadow(0 0 30px rgba(242,207,115,.7));animation:float 2.6s ease-in-out infinite alternate}
.lsa-title{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;line-height:1.02;font-size:clamp(2.6rem,9vh,6.4rem)}
.lsa-title span,.lsa-name span,.lsa-all-t span{background:linear-gradient(90deg,#FFF3C4,#F2CF73 30%,#FFE08A 50%,#C98F2E 70%,#FFF3C4);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 1.5px #000) drop-shadow(0 0 18px rgba(242,207,115,.55));animation:shimmer 6s linear infinite}
.lsa-sub{margin:0;color:#F3ECFF;font-weight:700;font-size:clamp(1rem,2.8vh,1.8rem)}
.lsa-hint{margin:2vh 0 0;color:#FFE08A;font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:clamp(.8rem,1.8vh,1.1rem);animation:labelBlink 1.6s ease-in-out infinite}
.lsa-count{margin:0;color:#FFE08A;font-weight:800;letter-spacing:.22em;text-transform:uppercase;font-size:clamp(.85rem,2vh,1.3rem)}
.lsa-ring{width:clamp(5rem,12vh,7.5rem);aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFE08A,#9b6a1d 75%);border:3px solid #F2CF73;box-shadow:0 0 30px rgba(242,207,115,.45);color:#2b1250;font-weight:800;font-size:1.6rem}
.lsa-ring img{width:100%;height:100%;object-fit:cover}
.lsa-ring.big{width:clamp(11rem,36vh,21rem);border-width:6px;font-size:clamp(3rem,9vh,5rem);box-shadow:0 0 0 8px rgba(255,243,196,.18),0 0 90px rgba(242,207,115,.6);animation:photoIn 1s cubic-bezier(.2,1.4,.4,1) both}
.lsa-name{margin:.6vh 0 0;font-family:var(--display);font-weight:800;line-height:1.05;font-size:clamp(2rem,7vh,4.8rem);animation:fadeUp .7s .25s both}
.lsa-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;animation:fadeUp .7s .4s both}
.lsa-chip{padding:.35rem 1rem;border-radius:999px;font-weight:800;font-size:clamp(.9rem,2.2vh,1.4rem);background:linear-gradient(90deg,#FFE08A,#F2CF73);color:#2b1250}
.lsa-chip.lsa-cd{background:rgba(127,231,255,.14);color:#7FE7FF;border:1px solid rgba(127,231,255,.4)}
.lsa-chip.lsa-co{background:rgba(255,179,222,.12);color:#FFB3DE;border:1px solid rgba(255,179,222,.35)}
.lsa-years{margin:.8vh 0 0;display:inline-flex;align-items:baseline;gap:.6rem;padding:.5rem 1.6rem;border-radius:18px;border:2px solid #F2CF73;background:rgba(242,207,115,.1);animation:fadeUp .7s .55s both}
.lsa-years b{font-family:var(--display);font-size:clamp(2.4rem,7vh,4.6rem);line-height:1;color:#FFE08A;text-shadow:0 0 20px rgba(242,207,115,.6)}
.lsa-years span{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#FFF3C4;font-size:clamp(.95rem,2.4vh,1.5rem)}
.lsa-note{margin:0;color:#E9E0FF;font-style:italic;font-size:clamp(.95rem,2.2vh,1.3rem)}
.lsa-all-t{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(2rem,6vh,4rem)}
.lsa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:1.4vh 1.4vw;width:min(96vw,1500px);margin-top:1.2vh}
.lsa-grid.many{grid-template-columns:repeat(7,1fr)}
.lsa-cell{display:flex;flex-direction:column;align-items:center;gap:.3rem;text-align:center;animation:fadeUp .6s both}
.lsa-cell b{font-size:clamp(.75rem,1.6vh,1rem);line-height:1.15}
.lsa-cell small{color:#FFE08A;font-weight:700;font-size:clamp(.65rem,1.3vh,.85rem)}
.lsa .ld-when{margin-bottom:0}
.vn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin:.6rem 0}
.vn-card{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:.2rem;padding:.8rem .5rem;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.05)}
.vn-card.king{border-color:rgba(127,178,255,.55)}.vn-card.queen{border-color:rgba(255,122,198,.55)}
.vn-pic{width:6.5rem;aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#8fa6ff,#3a2a9a 75%);border:3px solid #F2CF73;color:#fff;font-weight:800;font-size:1.6rem}
.vn-card.queen .vn-pic{background:radial-gradient(circle at 35% 30%,#ff9ad0,#8a1f6a 75%)}
.vn-pic img{width:100%;height:100%;object-fit:cover}
.vn-pic.sm{width:3rem;font-size:.9rem;border-width:2px}
.vn-name{font-size:.95rem;line-height:1.2;margin-top:.3rem}
.vn-meta{color:var(--muted);font-size:.72rem}
.vn-org{color:#FFB3DE;font-size:.7rem;margin-bottom:.4rem}
.vn-vote{margin-top:auto!important;width:100%;padding:.55rem .4rem!important;font-size:.95rem!important}
.nm-card{max-width:40rem;margin:0 auto}
.nm-segs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.6rem 0 .8rem}
.nm-seg{display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.nm-seg.king[aria-pressed="true"]{border-color:#7FB2FF;background:rgba(74,99,224,.25)}
.nm-seg.queen[aria-pressed="true"]{border-color:#FF7AC6;background:rgba(224,34,138,.22)}
.nm-person{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .8rem;padding:.6rem .8rem;border-radius:12px;border:1px solid #F2CF73;background:rgba(242,207,115,.1)}
.nm-person small{color:var(--muted);flex-basis:100%}
.nm-photo{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin:.9rem 0}
.nm-prev,.nm-ph{width:11rem;height:11rem;border-radius:50%;object-fit:cover;border:4px solid #F2CF73}
.nm-ph{display:grid;place-items:center;color:var(--muted);border-style:dashed;font-size:.85rem}
.nm-list{display:grid;gap:.4rem;margin-bottom:.8rem}
.nm-item{display:flex;align-items:center;gap:.6rem;padding:.4rem .5rem;border-radius:12px;border:1px solid var(--line)}
.nm-t{flex:1;min-width:0;display:flex;flex-direction:column}
.nm-t small{color:var(--muted)}
/* camera */
.cam-dlg{width:min(34rem,96vw)}
.cam-box{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1}
.cam-video{width:100%;height:100%;object-fit:cover;display:block}
.cam-frame{position:absolute;inset:10%;border:3px dashed rgba(242,207,115,.8);border-radius:50%;pointer-events:none}
.cam-row{justify-content:center;margin-top:.8rem}
/* nominate: one column on phones, form + list side by side on tablets / laptops */
.nm-card{max-width:72rem!important}
.nm-wrap{display:grid;grid-template-columns:1fr;gap:1.2rem}

/* thin see-through scrollbars; the dashboard scrolls inside the page so the background fills the edge */
html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
::-webkit-scrollbar{width:8px;height:8px;background:transparent}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(242,207,115,.45)}
::-webkit-scrollbar-corner{background:transparent}
html:has(body.dashmode){overflow:hidden;height:100%;background:transparent}
body.dashmode{height:100%;min-height:0;overflow-y:auto;background:transparent}
.awn-name{margin:0;font-family:var(--display);font-weight:800;color:#fff;font-size:clamp(1.1rem,2.8vh,2rem);line-height:1.15}
.awn-meta{margin:.5vh 0 0;color:var(--muted);font-weight:600;font-size:clamp(.8rem,1.7vh,1.1rem)}
.awn-grid.many .awn-card{width:clamp(9rem,13vw,14rem);padding:1.6vh .8vw}
.awn-go{margin-top:3.5vh;min-width:min(28rem,80vw);font-size:clamp(1rem,1.6vw,1.4rem);padding:clamp(.9rem,2.2vh,1.3rem) 2rem;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .5s,transform .5s}
.awn-go.show{opacity:1;pointer-events:auto;transform:none;animation:goPulse 1.6s 1s ease-in-out infinite}
.aw-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:.8vw;margin-top:1vh;width:100%}
.aw-btns .ld-btn{min-width:min(16rem,45%);margin:0}
/* awards screen */
.aw-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:2vw;max-width:1600px;width:100%;margin:0 auto}
.aw-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1vh;padding:2.5vh 2vw;border-radius:28px;border:1px solid var(--line);
  background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(139,63,193,.35),transparent 70%),rgba(22,12,52,.75);box-shadow:0 40px 90px -40px rgba(0,0,0,.9);overflow:hidden}
.aw-card.queen{background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(224,34,138,.3),transparent 70%),rgba(22,12,52,.75)}
.aw-card.king{background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(74,99,224,.32),transparent 70%),rgba(22,12,52,.75)}
.aw-card.done{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,207,115,.5),0 0 80px rgba(242,207,115,.25)}
.aw-crown{font-size:clamp(2.2rem,6vh,4rem);line-height:1;filter:drop-shadow(0 0 20px rgba(242,207,115,.6))}
.aw-crown.big{font-size:clamp(3rem,10vh,6rem);margin-bottom:2vh}
.aw-label{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-size:clamp(1rem,2vw,2rem)}
.aw-orb{width:clamp(7rem,22vh,15rem);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(3rem,10vh,7rem);color:#fff;
  box-shadow:0 0 0 4px rgba(242,207,115,.6),0 0 60px rgba(242,207,115,.35);animation:glow 1.8s ease-in-out infinite alternate}
.aw-orb.queen{background:radial-gradient(circle at 35% 30%,#ff6fb5,#8B3FC1 70%)}
.aw-orb.king{background:radial-gradient(circle at 35% 30%,#8fa6ff,#3a2a9a 70%)}
.aw-name{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4.5vh,3.4rem);line-height:1.1;color:var(--ink)}
.aw-name:empty,.aw-meta:empty{display:none}
.aw-meta{margin:0;color:var(--muted);font-weight:600;font-size:clamp(.9rem,2vh,1.3rem)}
.aw-count{margin:0;color:var(--muted);font-size:clamp(.75rem,1.5vh,1rem)}
.aw-card .ld-btn{min-width:min(16rem,45%)}
.aw-strip{display:flex;align-items:center;justify-content:center;gap:1.4vw;margin:1.2vh auto 0;padding:1vh 1.4vw;border:1px solid var(--line);border-radius:18px;background:rgba(14,8,34,.7);max-width:1000px}
.aw-strip.closed .aw-qr,.aw-strip.closed .aw-url{display:none}
.aw-qr{width:clamp(70px,12vh,120px);height:auto;background:#fff;border-radius:10px;padding:4px}
.aw-status{margin:0;font-weight:700;font-size:clamp(.9rem,1.8vh,1.3rem)}
.aw-live{color:var(--ok);display:inline-flex;align-items:center;gap:.5rem}

.aw-closed{color:var(--warn)}
.aw-tot{color:var(--muted);font-weight:600}
.aw-url{margin:.2rem 0 0;color:var(--muted);font-size:.8rem}
.aw-roll{margin-top:3vh;font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,8vw,7rem);line-height:1.1;background:linear-gradient(180deg,#FFF3C4,#F2CF73 45%,#C9962E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;min-height:1.1em}

.aw-tie{margin:.6vh 0 0;color:var(--rose);font-weight:800;letter-spacing:.2em;text-transform:uppercase}
@media (orientation:portrait),(max-width:900px){ .aw-body{grid-template-columns:1fr} }
.db-vote{margin-top:1rem}

.db-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:.6rem;margin:0 0 1rem}

.dname2{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* registration desk: staff / guest switch */
.who-seg{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;padding:.3rem;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:.4rem}

/* winner celebration */
.cele{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse 60% 55% at 50% 50%,rgba(90,40,150,.9) 0%,rgba(22,10,50,.97) 55%,rgba(4,2,12,.99) 100%);animation:introIn .35s ease both}
.cele-stage::before{content:"";position:absolute;left:50%;top:50%;width:90vmin;height:90vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(242,207,115,.28),rgba(242,207,115,0) 60%);z-index:-1;animation:glow 1.6s ease-in-out infinite alternate}
.cele.out{animation:celeOut .7s ease both}
@keyframes celeOut{to{opacity:0;transform:scale(.92)}}
.cele-rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(242,207,115,.22) 0 5deg,transparent 5deg 15deg);animation:rays 14s linear infinite;mask-image:radial-gradient(circle,#000 20%,transparent 65%);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 65%)}
.cele.grand .cele-rays{background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,243,196,.35) 0 4deg,transparent 4deg 12deg);animation-duration:9s}
.cele-sky{position:absolute;inset:0;width:100%;height:100%}
.cele-ring{position:absolute;width:60vmin;height:60vmin;border-radius:50%;border:3px solid rgba(242,207,115,.7);box-shadow:0 0 60px rgba(242,207,115,.5),inset 0 0 60px rgba(242,207,115,.3);animation:ringPulse 1.6s ease-in-out infinite alternate}
@keyframes ringPulse{from{transform:scale(.92);opacity:.55}to{transform:scale(1.06);opacity:1}}
.cele-stage{position:relative;z-index:1;text-align:center;padding:0 4vw}
.cele-crown{font-size:clamp(3rem,10vh,7rem);line-height:1;animation:crown .9s cubic-bezier(.2,1.5,.4,1) both,float 2.4s 1s ease-in-out infinite alternate}
@keyframes crown{from{transform:translateY(-60vh) rotate(-30deg)}to{transform:none}}
@keyframes float{to{transform:translateY(-12px)}}
.cele-title{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:clamp(1.6rem,5vw,4.2rem);color:var(--ink)}
.cele-title span{display:inline-block;opacity:0;animation:letter .6s cubic-bezier(.2,1.6,.4,1) forwards}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px) rotate(-1deg)}40%{transform:translateX(12px) rotate(1deg)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
.intro-skip{position:absolute;right:1.5vw;bottom:2vh;z-index:2;background:rgba(14,8,34,.6);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:.45rem 1rem;font-weight:600;cursor:pointer;opacity:.6}

.tone-royal{--p2-a:#FF7AC6;--p2-b:#7FB2FF;--p2-ring:linear-gradient(135deg,#7FB2FF,#F2CF73,#FF7AC6)}
.p2-kick{margin:0;font-size:.7rem;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.p2-badge{display:inline-block;margin:.7rem 0 .2rem;padding:.25rem .9rem;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#1b1040;background:linear-gradient(90deg,var(--p2-a),var(--p2-b))}
.p2-title{margin:.2rem 0 .1rem;font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:1.02;letter-spacing:.03em;font-size:clamp(1.9rem,7.5vw,2.6rem)}
.p2-title span{display:block;background:linear-gradient(90deg,var(--p2-a),#FFF3C4 50%,var(--p2-b));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite;filter:drop-shadow(0 2px 14px rgba(0,0,0,.35))}
.tone-royal .p2-title span:first-child{font-size:.62em;letter-spacing:.2em;background:none;-webkit-text-fill-color:var(--ink);color:var(--ink);filter:none}
.p2-motto{margin:.35rem 0 0;font-family:var(--serif);font-style:italic;font-size:1.05rem;color:#F7E7B8;white-space:nowrap}
.poster2 .bd-tag{margin:.35rem 0 0}
.poster2 .bd-text{font-size:1.15rem}
.p2-qrwrap{position:relative;width:min(62%,14rem);margin:1rem auto .4rem;padding:4px;border-radius:20px;background:linear-gradient(135deg,var(--p2-a),#FFF3C4,var(--p2-b));box-shadow:0 0 40px -6px var(--p2-a)}
.p2-qr{display:block;width:100%;height:auto;border-radius:16px;background:#fff;padding:.45rem}
.p2-cta{margin:.5rem 0 0;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:.1em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--p2-b),#FFF3C4,var(--p2-a));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.p2-steps{list-style:none;margin:.8rem auto 0;padding:.7rem .9rem;display:grid;gap:.5rem;max-width:20rem;text-align:left;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.p2-steps li{display:flex;align-items:center;gap:.7rem;font-weight:700;font-size:.95rem}
.p2-steps li b{flex:none;width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;font-size:.85rem;color:#1b1040;background:linear-gradient(135deg,var(--p2-a),var(--p2-b))}
.p2-steps .li2{display:flex;flex-direction:column;line-height:1.2}
.p2-steps .li2 small{font-size:.76em;font-weight:600;color:var(--muted)}
.p2-fine{margin:.8rem 0 0;font-size:.78rem;color:var(--muted)}
.poster2 .poster-crowns{margin:.7rem 0 0}
.poster2 .poster-crowns .royal{width:3.8rem}
/* staff poster: same royal look as the voting poster, in teal & gold */
.tone-gala{--p2-a:#3FE3CF;--p2-b:#F2CF73;--p2-ring:linear-gradient(135deg,#3FE3CF,#F2CF73,#FF7AC6)}
.tone-gala .p2-title span:first-child{font-size:.62em;letter-spacing:.2em;background:none;-webkit-text-fill-color:var(--ink);color:var(--ink);filter:none}
.tone-gala .p2-title span:last-child{background-image:linear-gradient(90deg,#3FE3CF,#FFF3C4 35%,#F2CF73 65%,#3FE3CF);filter:drop-shadow(0 0 18px rgba(63,227,207,.45))}
.tone-gala .p2-qrwrap{box-shadow:0 0 54px -4px #3FE3CF,0 0 90px -20px #F2CF73}
.gala-ico{display:inline-block;line-height:0;filter:drop-shadow(0 4px 14px rgba(242,207,115,.5))}
.poster2 .gala-ico{width:4.6rem;height:4.2rem;display:grid;place-items:center}
.gala-ico svg{width:100%;height:100%;display:block}
.gala-pair{align-items:stretch!important;gap:1.6rem!important}
.gala-pair .royal-one{display:grid!important;grid-template-rows:4.2rem auto;justify-items:center;align-items:center;row-gap:.45rem}
.gala-pair .royal-tag{margin:0!important;line-height:1!important}
.tone-gala .p2-title{margin-top:.7rem}
.gala-ico.tk{animation:float 2.6s ease-in-out infinite alternate}
.gala-ico.tb{animation:float 2.6s ease-in-out infinite alternate}
.royal-tag.lucky{color:#FFE08A}
.royal-tag.table{color:#7DF0E0}
/* dashboard: seating plan */
.seat-tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.3rem 0 .8rem}
.seat-tools input{max-width:20rem}
.seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:.7rem}
.seat-card{border:1px solid var(--line);border-radius:14px;padding:.7rem .8rem;background:rgba(255,255,255,.035)}
.seat-card h3{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin:0 0 .45rem;font-size:1.05rem;color:var(--gold)}
.seat-card h3 small{font-size:.75rem;color:var(--muted);font-weight:700}
.seat-card.full h3 small{color:var(--ok)}
.seat-card.none h3{color:var(--warn)}
.seat-dept{margin:.4rem 0 .15rem;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7DF0E0}
.seat-card ol{margin:0;padding-left:1.3rem;font-size:.86rem;line-height:1.45}
.seat-card ol small{color:var(--muted)}
.seat-card{cursor:pointer;transition:border-color .2s,transform .2s}
.seat-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.seat-card.vip{border-color:rgba(242,207,115,.6);background:linear-gradient(160deg,rgba(242,207,115,.14),rgba(255,255,255,.03) 60%)}
.seat-dept.vip{color:var(--gold)}
.seat-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 .8rem}
.seat-chip{font:inherit;font-size:.82rem;font-weight:700;padding:.35rem .7rem;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer}
.seat-chip:hover{border-color:var(--gold)}
.seat-chip.vip{border-color:var(--gold);color:var(--gold)}
.seat-chip.none{color:var(--warn)}
.seat-dlg{width:min(36rem,94vw);max-height:88vh;border:1px solid var(--line);border-radius:18px;background:#1a0f33;color:var(--ink);padding:1rem 1.1rem;overflow:auto}
.seat-dlg::backdrop{background:rgba(5,2,15,.7)}
.seat-dlg h2{display:flex;align-items:center;gap:.5rem;margin:0;color:var(--gold)}
.seat-dlg .vip-badge{font-size:.7rem;letter-spacing:.14em;padding:.2rem .6rem;border-radius:999px;background:linear-gradient(90deg,#FFF3C4,#F2CF73);color:#2b1250}
.seat-dlg ol{padding-left:1.4rem;line-height:1.55}
.seat-dlg ol small{color:var(--muted)}
.vip-tbl input{min-width:0;width:100%}
.ds-pane textarea{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;font:inherit;box-sizing:border-box}
@media print{ .poster2{box-shadow:none} }
/* one see-through music button (stop / play): barely visible on the big screen, clear when the mouse comes near */
.mtoggle{position:absolute;left:1.2vw;bottom:1.6vh;z-index:60;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;cursor:pointer;
  background:transparent;border:1px solid rgba(255,255,255,.12);color:#fff;opacity:.14;transition:opacity .25s,background .25s}
.mtoggle:hover,.mtoggle:focus-visible{opacity:.95;background:rgba(14,8,34,.65)}
.mtoggle.fixed{position:fixed;z-index:44}
body:not(.drawmode) .mtoggle.fixed{display:none}
/* stage keys S · L · F */
.skeys{position:absolute;left:.6vw;bottom:1vh;z-index:60;display:flex;flex-direction:column;gap:.25rem;opacity:.16;transition:opacity .25s}
.skeys:hover,.skeys:focus-within{opacity:1}
.skeys.fixed{position:fixed;z-index:44}
body:not(.drawmode) .skeys.fixed{display:none}
.skey{width:1.55rem;height:1.55rem;border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.7rem;letter-spacing:0;cursor:pointer;
  background:rgba(14,8,34,.35);border:1px solid rgba(255,255,255,.22);color:#fff}
.skey:hover{background:rgba(14,8,34,.75);border-color:var(--gold);color:var(--gold)}
.skey.on{background:rgba(242,207,115,.25);border-color:var(--gold);color:var(--gold)}
.skey:disabled{opacity:.35}
.mtoggle{display:none!important}
/* celebration buttons: bottom-right, subtle */
.cele-actions{position:absolute;right:1.5vw;bottom:2vh;z-index:5;display:flex;gap:.5rem}
.cele-actions .intro-skip{position:static}
.ld-standby .intro-logos{height:clamp(36px,8vh,80px)}
.ld-standby .intro-kick{font-size:clamp(.9rem,1.9vw,1.6rem)}
.ld-standby-hint{position:absolute;left:0;right:0;bottom:2vh;margin:0;text-align:center;font-size:.72rem;color:var(--muted);opacity:.25;z-index:2}
.intro-word.count.last{filter:drop-shadow(0 0 40px rgba(255,61,154,.6))}
/* WOW draw effects */
.ld.dim::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 50%,transparent 40%,rgba(5,2,14,.55) 100%);pointer-events:none;z-index:3;animation:introIn .6s ease both}
.spin-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;border-radius:inherit}
.ld-panel.spinfx::before{content:"";position:absolute;inset:-60%;z-index:0;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 20deg,rgba(242,207,115,.22) 26deg,transparent 34deg 110deg,rgba(255,122,198,.2) 116deg,transparent 124deg 200deg,rgba(127,178,255,.2) 206deg,transparent 214deg 290deg,rgba(242,207,115,.22) 296deg,transparent 304deg);
  animation:rays 2.4s linear infinite}
.ld-panel.spinfx.hot::before{animation-duration:1.4s}
.ld-panel.spinfx .ld-num{animation:spinPulse .5s ease-in-out infinite alternate}
@keyframes spinPulse{from{filter:drop-shadow(0 0 20px rgba(242,207,115,.4))}to{filter:drop-shadow(0 0 60px rgba(255,243,196,.95))}}
.ld-num.zoomland{animation:zoomLand .9s cubic-bezier(.15,1.6,.35,1) both!important}
@keyframes zoomLand{0%{transform:scaleX(1.12) scale(1.9);filter:brightness(2.4) drop-shadow(0 0 80px #fff)}60%{transform:scaleX(1.12) scale(.95)}100%{transform:scaleX(1.12) scale(1);filter:drop-shadow(0 0 40px rgba(242,207,115,.6))}}
.land-burst{position:absolute;left:50%;top:48%;width:10px;height:10px;z-index:2;pointer-events:none;border-radius:50%;
  box-shadow:0 0 0 0 rgba(255,243,196,.9),0 0 120px 60px rgba(242,207,115,.6);animation:landBurst 1.6s ease-out forwards}
.land-burst.grand{box-shadow:0 0 0 0 #fff,0 0 160px 90px rgba(255,243,196,.8)}
@keyframes landBurst{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}40%{opacity:1}100%{transform:translate(-50%,-50%) scale(60);opacity:0}}
.coin-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){ .ld-panel.spinfx::before,.ld-panel.spinfx .ld-num,.ld-num.zoomland{animation:none!important} }
/* King & Queen polish */
.aw-strip .aw-url{display:none!important}
.aw-label{position:relative;display:inline-block;padding:0 .2em}
.aw-label .glints,.awn .awc-title .glints,.awc .awc-title .glints{position:absolute;inset:-20% -4%;pointer-events:none}
.glints i{position:absolute;width:12px;height:12px;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 6px #fff);opacity:0;animation:twinkle 2s ease-in-out infinite}
.aw-label::after{content:attr(data-t);position:absolute;inset:0;padding:0 .2em;-webkit-text-fill-color:transparent;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 66%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.awn .awc-title,.awc .awc-title{position:relative;display:table;margin-left:auto;margin-right:auto}
/* finalists: cards drop in under a spotlight, a light sweep crosses each card, a halo turns behind each face */
.awn-card{position:relative;overflow:hidden;animation:cardDrop .9s cubic-bezier(.2,1.4,.4,1) both!important}
@keyframes cardDrop{0%{opacity:0;transform:translateY(-60px) rotateX(70deg) scale(.7);filter:brightness(2.4) blur(6px)}60%{opacity:1;filter:brightness(1.4)}100%{transform:none;filter:none}}
.awn-card::before{content:"";position:absolute;left:50%;top:-140%;width:140%;height:180%;transform:translateX(-50%);background:radial-gradient(ellipse 40% 60% at 50% 100%,rgba(255,250,230,.28),transparent 70%);pointer-events:none;animation:cardSpot 1.6s ease-out both}
@keyframes cardSpot{0%{opacity:0}30%{opacity:1}100%{opacity:.35}}
.awn-card::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:250% 100%;animation:shine 3s .8s ease-in-out infinite;pointer-events:none}
.awn-av{position:relative}
.awn-av::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,243,196,.95),transparent 30%,rgba(255,255,255,.7),transparent 60%,rgba(255,243,196,.95),transparent);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%);animation:haloSpin 2.6s linear infinite}
.awn-badge{position:absolute;top:.7rem;right:.7rem;font-size:.62rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;padding:.15rem .5rem;border-radius:999px;color:#1b1040;background:linear-gradient(90deg,#FFF3C4,#F2CF73)}
.awn-name{background:linear-gradient(180deg,#ffffff,#FFF3C4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.vortex-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.awc.shake{animation:ldshake .7s ease}
@media (prefers-reduced-motion:reduce){ .glints i,.aw-label::after,.awn-card,.awn-card::before,.awn-card::after,.awn-av::before{animation:none!important} }
/* ===== Lucky draw: brighter, bolder text ===== */
.ld-label{color:#FFE7A6!important;font-weight:800!important;text-shadow:0 0 14px rgba(242,207,115,.55)}
.ld-select{color:#FFE08A!important;font-weight:800!important;border:1.5px solid #F2CF73!important;background:rgba(40,18,80,.85)!important;box-shadow:0 0 18px -2px rgba(242,207,115,.55),inset 0 0 12px rgba(242,207,115,.15)}
.ld-line{font-size:clamp(1.6rem,3.2vw,3.4rem)!important;font-weight:700!important;line-height:1.2;
  background:linear-gradient(90deg,#FF9AD0,#FFF3C4 35%,#FFD36E 60%,#FF9AD0);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 4s linear infinite;filter:drop-shadow(0 0 14px rgba(255,122,198,.45)) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
/* the winning number: vivid gradient, bright outline, blinking glow */
.ld-num{background:linear-gradient(180deg,#FFFFFF 0%,#FFF1A8 22%,#FFC93C 55%,#FF8A00 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;
  -webkit-text-stroke:3px rgba(255,248,220,.95);paint-order:stroke fill;filter:drop-shadow(0 0 22px rgba(255,201,60,.75)) drop-shadow(0 0 60px rgba(255,61,154,.35))}
.ld-num.spinning{-webkit-text-stroke:2px rgba(255,248,220,.6)}
.ld-panel.has-winner .ld-num{animation:numBlink 1.1s ease-in-out infinite}
.ld-panel.has-winner .ld-num.zoomland{animation:zoomLand .9s cubic-bezier(.15,1.6,.35,1) both,numBlink 1.1s .9s ease-in-out infinite!important}
@keyframes numBlink{
  0%,100%{filter:drop-shadow(0 0 18px rgba(255,201,60,.7)) drop-shadow(0 0 50px rgba(255,61,154,.3)) brightness(1)}
  50%{filter:drop-shadow(0 0 36px rgba(255,243,196,1)) drop-shadow(0 0 90px rgba(255,61,154,.75)) brightness(1.3)}}
/* CONGRATULATIONS: rainbow-gold shimmer, glow and sparkles */
.cele-title{position:relative;display:table;margin-left:auto!important;margin-right:auto!important}
.cele-title span{background-image:linear-gradient(90deg,#FFD36E,#FF7AC6 25%,#FFF3C4 50%,#7FB2FF 75%,#FFD36E);background-size:400% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:letter .6s cubic-bezier(.2,1.6,.4,1) forwards,shimmer 3.5s 1.5s linear infinite!important;
  filter:drop-shadow(0 0 12px rgba(255,211,110,.75)) drop-shadow(0 0 30px rgba(255,122,198,.45))}
.cele-title .glints{position:absolute;inset:-25% -3%;pointer-events:none}
.cele-title .glints i{width:16px;height:16px}
.cele-num span{-webkit-text-stroke:3px rgba(255,248,220,.9);paint-order:stroke fill;
  background-image:linear-gradient(110deg,#FF8A00 0%,#FFC93C 25%,#FFFFFF 45%,#FFC93C 62%,#FF8A00 100%)!important;
  animation:shimmer 2.2s 1s linear infinite,numBlink 1.1s 1.2s ease-in-out infinite!important}
@media (prefers-reduced-motion:reduce){ .ld-line,.ld-panel.has-winner .ld-num,.cele-title span,.cele-num span{animation:none!important} .cele-title span{opacity:1} }
/* ===== Winning number: game-show font, black outline (light on the GPU), blinking glow ===== */
:root{--numfont:"Bungee","Montserrat",system-ui,sans-serif}
.ld-num,.cele-num span{font-family:var(--numfont)!important;font-weight:400!important;letter-spacing:.02em!important;-webkit-text-stroke:5px #120617!important;paint-order:stroke fill}
.ld-num.spinning{-webkit-text-stroke:3px #120617!important}
.ld-num,.ld-num.spinning{filter:drop-shadow(0 0 26px rgba(255,201,60,.7))}
.cele-num span{filter:drop-shadow(0 0 40px rgba(255,201,60,.8))}
@keyframes numBlink{0%,100%{filter:drop-shadow(0 0 18px rgba(255,201,60,.7)) brightness(1)}50%{filter:drop-shadow(0 0 50px rgba(255,243,196,1)) brightness(1.25)}}
/* ===== Winner's name, staff ID and department: shimmering, glowing and blinking ===== */
.cele-name,.ld-pname{background:linear-gradient(90deg,#FFFFFF,#FFE08A 30%,#FFFFFF 50%,#FF9AD0 70%,#FFFFFF);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:clamp(1.9rem,6vh,4.2rem)!important}
.cele-name{animation:fadeUp .7s 1.1s ease forwards,shimmer 3s 1.8s linear infinite,nameBlink 1.6s 1.8s ease-in-out infinite!important}
.ld-panel.has-winner .ld-pname{font-size:clamp(1.5rem,3.6vw,3.6rem)!important;animation:shimmer 3s linear infinite,nameBlink 1.6s ease-in-out infinite}
@keyframes nameBlink{0%,100%{filter:drop-shadow(0 0 6px rgba(255,224,138,.5))}50%{filter:drop-shadow(0 0 22px rgba(255,224,138,1)) drop-shadow(0 0 40px rgba(255,122,198,.6))}}
.cele-meta,.ld-panel.has-winner .ld-pmeta{color:#BFD8FF!important;font-weight:700!important;text-shadow:0 0 12px rgba(127,178,255,.7)}

.ld-panel.has-winner .ld-pmeta{animation:metaBlink 1.6s .3s ease-in-out infinite}
@keyframes metaBlink{0%,100%{opacity:1;text-shadow:0 0 10px rgba(127,178,255,.6)}50%{opacity:.8;text-shadow:0 0 22px rgba(127,178,255,1),0 0 40px rgba(255,255,255,.5)}}
@media (prefers-reduced-motion:reduce){ .cele-name,.cele-meta,.ld-pname,.ld-pmeta{animation:none!important;opacity:1} }
/* ===== per-place draw effects ===== */

.lasers{position:fixed;inset:-30%;z-index:4;pointer-events:none;mix-blend-mode:screen;opacity:.75;
  background:conic-gradient(from 0deg at 50% 60%,transparent 0 8deg,rgba(255,61,154,.55) 9deg,transparent 11deg 52deg,rgba(242,207,115,.6) 53deg,transparent 55deg 98deg,rgba(127,178,255,.55) 99deg,transparent 101deg 150deg,rgba(255,61,154,.55) 151deg,transparent 153deg 205deg,rgba(242,207,115,.6) 206deg,transparent 208deg 260deg,rgba(127,178,255,.55) 261deg,transparent 263deg 310deg,rgba(242,207,115,.6) 311deg,transparent 313deg);

.ld.quake{animation:quake .12s linear infinite}
@keyframes quake{0%{transform:translate(0,0)}25%{transform:translate(-4px,3px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(2px,3px)}}
.shock-ring{position:absolute;left:50%;top:48%;width:40px;height:40px;border-radius:50%;z-index:3;pointer-events:none;border:4px solid #FFF3C4;box-shadow:0 0 30px #F2CF73,inset 0 0 20px #F2CF73;animation:shockRing 1.3s ease-out forwards}
.shock-ring.r1{border-color:#E8A86A;box-shadow:0 0 30px #CD7F32}
.shock-ring.r2{border-color:#EEF2FF;box-shadow:0 0 30px #C9D6FF}
.shock-ring.r4{border-color:#FF9AD0;box-shadow:0 0 40px #FF3D9A,inset 0 0 30px #F2CF73;border-width:6px}
@keyframes shockRing{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(30);opacity:0}}
.grand-banner{position:fixed;inset:0;z-index:72;background:radial-gradient(ellipse 60% 35% at 50% 50%,rgba(10,4,24,.8),transparent 75%);display:flex;align-items:center;justify-content:center;gap:2vw;pointer-events:none;animation:bannerSlam 2.4s cubic-bezier(.2,1.4,.4,1) forwards;will-change:transform,opacity}
.grand-banner .gb-cup{font-size:clamp(2.4rem,7vw,6rem)}
.grand-banner span{font-family:var(--numfont);font-size:clamp(2.6rem,8vw,7.5rem);letter-spacing:.03em;white-space:nowrap;
  background:linear-gradient(90deg,#FFD36E,#FF3D9A,#FFF3C4,#7FB2FF,#FFD36E);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:5px #120617;paint-order:stroke fill;animation:shimmer 1.6s linear infinite}
@keyframes bannerSlam{0%{transform:scale(4) rotate(-6deg);opacity:0}14%{transform:scale(.92) rotate(0);opacity:1}22%{transform:scale(1.04)}30%,78%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}

/* ===== The only setting: your Apps Script web app link (ends in /exec) ===== */
var API_URL = "https://script.google.com/macros/s/AKfycbz-LqSpkU2MoQ6f_lpfujrstRI8NuJX8VXITolHSNSiU3nIiK0Az_Hj4nz5vJsXv53wRQ/exec";
var BOOT = null;
/* All data goes to the Google Sheet through the Apps Script API. No Google sign-in is used. */
async function apiPost(fn, args){
  let res, text = "";
  try{
    res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:fn, args:args || []}), credentials:"omit", redirect:"follow"});
    text = await res.text();
  }catch(e){ const err = new Error("No connection. Check your Wi-Fi or mobile data and try again."); err.detail = "network: " + (e && e.message); throw err; }
  let data = null; try{ data = JSON.parse(text); }catch(e){}
  if (!data){
    const err = new Error("The registration system isn’t ready. Please go to the registration counter.");
    err.detail = /doPost/i.test(text) ? "Apps Script has no doPost: paste the latest Code.gs and deploy a New version." : ("status " + (res && res.status) + ": " + text.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 160));
    throw err;
  }
  if (!data.ok) throw new Error(data.error || "Something went wrong. Please try again.");
  return data.result;
}
async function call(fn, ...args){ return apiPost(fn, args); }
window.__apiPost = apiPost;

window.__startApp = function(){
"use strict";

function pageUrl(p){ return window.__PREVIEW ? B.appUrl + "#" + (p || "form") : B.appUrl + (p ? "?page=" + p : ""); }
/* open another event page. In full screen (big screen / LED) it opens on top of this page so full screen is kept;

const IN_VIEWER = window.self !== window.top;

const PIN = {
  get(){ try{ return sessionStorage.getItem("ghg-pin") || localStorage.getItem("ghg-pin"); }catch(e){ return null; } },
  set(v){ try{ sessionStorage.setItem("ghg-pin", v); localStorage.setItem("ghg-pin", v); }catch(e){} },

};
function localUrl(url){   /* in the Claude preview, pages are #views of this same file */

/* take a photo with the device camera (laptop webcam, phone or tablet); resolves to a File, or null if cancelled */
function cameraShot(){
  return new Promise(async resolve => {
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return resolve(undefined);
    let facing = "environment", stream = null;
    const video = el("video", {autoplay:true, playsinline:true, muted:true, class:"cam-video"});
    const dlg = el("dialog", {class:"ld-dlg cam-dlg"});
    const stopAll = () => { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
    const start = async () => { stopAll(); try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:1280}, height:{ideal:1280}}, audio:false}); video.srcObject = stream; await video.play(); return true; }catch(e){ return false; } };
    const done = v => { stopAll(); try{ dlg.close(); }catch(e){} dlg.remove(); resolve(v); };
    dlg.append(el("div", {class:"cam-box"}, video, el("div", {class:"cam-frame", "aria-hidden":"true"})),
      el("div", {class:"row cam-row"},
        el("button", {class:"btn primary big", type:"button", text:"📸 Capture", onclick:() => { const w = video.videoWidth, h = video.videoHeight; if (!w) return;
          const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(video, 0, 0, w, h);
          c.toBlob(b => done(b ? new File([b], "photo.jpg", {type:"image/jpeg"}) : null), "image/jpeg", .9); }}),
        el("button", {class:"btn", type:"button", text:"🔄 Switch camera", onclick:() => { facing = facing === "environment" ? "user" : "environment"; start(); }}),
        el("button", {class:"btn mini", type:"button", text:"Cancel", onclick:() => done(null)})));
    document.body.append(dlg); dlg.showModal();
    if (!(await start())){ facing = "user"; if (!(await start())){ done(undefined); } }
  });
}
/* small picture for the voting page (fast on phones) */
function thumbFromFile(file){
  return new Promise((ok, bad) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); const side = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = 150;
      c.getContext("2d").drawImage(img, (img.width - side) / 2, Math.max(0, (img.height - side) / 2.8), side, side, 0, 0, 150, 150); ok(c.toDataURL("image/jpeg", .7)); };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("That file isn’t a picture.")); }; img.src = url; });
}

  const cx = cv.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 1.25); cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const cs = getComputedStyle(document.documentElement), cols = ["--jade","--saffron","--rose","--lapis","--gold"].map(h => cs.getPropertyValue(h).trim());
  let bits = []; for (let i = 0; i < 200; i++){ const a = Math.random()*Math.PI*2, s = 4+Math.random()*9; bits.push({x:innerWidth/2, y:innerHeight*.45, vx:Math.cos(a)*s, vy:Math.sin(a)*s-5, w:5+Math.random()*7, h:3+Math.random()*5, r:Math.random()*6, vr:(Math.random()-.5)*.35, c:cols[i%5], life:0}); }

    bits.forEach(b => { b.vy += .22; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++; cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r); cx.globalAlpha = Math.max(0, 1-b.life/200); cx.fillStyle = b.c; cx.fillRect(-b.w/2,-b.h/2,b.w,b.h); cx.restore(); });
    bits = bits.filter(b => b.life < 200 && b.y < innerHeight+40); if (bits.length) requestAnimationFrame(frame); else cx.clearRect(0,0,innerWidth,innerHeight); })();
}

/* ---------- QR posters: one colourful design for staff, guest and voting ---------- */
function qrCanvas(url){
  const q = qrcode(0, "M"); q.addData(url); q.make();
  const n = q.getModuleCount(), cell = 14, size = (n + 8) * cell, c = document.createElement("canvas");
  c.width = c.height = size; const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, size, size); g.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect((k + 4) * cell, (r + 4) * cell, cell, cell);
  return c.toDataURL("image/png");
}
function fitPoster(p){
  const on = IN_VIEWER || !!document.fullscreenElement;
  document.documentElement.classList.toggle("fitscreen", on);
  p.style.cssText = ""; if (!on) return;
  const w = p.offsetWidth, h = p.offsetHeight; if (!w || !h) return;
  const sc = Math.min(innerWidth / w, innerHeight / h) * .95;
  p.style.cssText = "position:fixed;left:50%;top:50%;margin:0;width:" + w + "px;transform:translate(-50%,-50%) scale(" + sc + ");transform-origin:center";
}
function posterView(o){
  clear(); document.body.classList.add("postermode");
  setTimeout(() => { const p = app.querySelector(".poster2"); if (!p) return; const fit = () => fitPoster(p);
    fit(); setTimeout(fit, 400); addEventListener("resize", fit); document.addEventListener("fullscreenchange", () => setTimeout(fit, 150)); }, 0);
  app.append(el("div", {class:"poster2 tone-" + o.tone},
    el("p", {class:"p2-kick", text:"Annual Dinner 2027 · Global Harmony Gala"}),
    o.top || null,
    o.badge ? el("p", {class:"p2-badge", text:o.badge}) : null,

    o.tag ? bdTag(o.tag) : el("p", {class:"p2-motto", text:"United by Diversity, Connected by Excellence"}),
    el("div", {class:"p2-qrwrap"}, el("img", {class:"p2-qr", src:qrCanvas(o.url), alt:o.alt})),
    el("p", {class:"p2-cta", text:o.cta}),
    el("ol", {class:"p2-steps"}, o.steps.map((s, i) => el("li", null, el("b", {text:String(i + 1)}),
      Array.isArray(s) ? el("span", {class:"li2"}, s[0], el("small", {text:s[1]})) : el("span", {text:s})))),
    el("p", {class:"p2-fine", text:o.fine})));
}
